[project]
name = "iwss"
version = "0.1.0"
description = "Large-scale passive measurement study of security posture across the Italian web"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "cryptography>=44.0",
    "dnspython>=2.7",
    "scipy>=1.15",
    "polars>=1.20",
    "click>=8.1",
    "rich>=13.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
